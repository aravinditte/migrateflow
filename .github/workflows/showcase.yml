name: Showcase E2E Integration

on:
  push:
    branches: [ main, fix/**, feat/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  showcase-e2e:
    name: Live Showcase E2E & Bootstrap Recovery
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: migrateflow
          POSTGRES_USER: migrateflow
          POSTGRES_PASSWORD: migrateflow-ci-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Start Spring Boot backend in background
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/migrateflow
          SPRING_DATASOURCE_USERNAME: migrateflow
          SPRING_DATASOURCE_PASSWORD: migrateflow-ci-pw
          MIGRATEFLOW_DEMO_SEED_ENABLED: "true"
          MIGRATEFLOW_SHOWCASE_BOOTSTRAP_ENABLED: "true"
          MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN: "ci-secret-showcase-token"
          MIGRATEFLOW_ENGINEER_PASSWORD: "engineer-ci-pw"
          MIGRATEFLOW_REVIEWER_PASSWORD: "reviewer-ci-pw"
          MIGRATEFLOW_AUDITOR_PASSWORD: "auditor-ci-pw"
          MIGRATEFLOW_ADMIN_PASSWORD: "admin-ci-pw"
        run: |
          chmod +x ./mvnw
          ./mvnw spring-boot:start -Dspring-boot.run.arguments="--server.port=8081" &
          echo "Waiting for Spring Boot backend to become ready..."
          for i in {1..60}; do
            if curl -s http://localhost:8081/actuator/health | grep -q "UP"; then
              echo "Backend is UP!"
              break
            fi
            sleep 2
          done

      - name: Execute real Python bootstrap orchestration (Run 1)
        env:
          MIGRATEFLOW_BASE_URL: "http://localhost:8081"
          MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN: "ci-secret-showcase-token"
          MIGRATEFLOW_ENGINEER_PASSWORD: "engineer-ci-pw"
          MIGRATEFLOW_REVIEWER_PASSWORD: "reviewer-ci-pw"
          MIGRATEFLOW_AUDITOR_PASSWORD: "auditor-ci-pw"
          MIGRATEFLOW_ADMIN_PASSWORD: "admin-ci-pw"
          MIGRATEFLOW_SHOWCASE_STATE_FILE: "/tmp/showcase-state.json"
        run: |
          python3 scripts/bootstrap-showcase.py

      - name: Run independent anonymous verifier
        env:
          MIGRATEFLOW_BASE_URL: "http://localhost:8081"
        run: |
          python3 scripts/verify-showcase.py

      - name: Run live contract verification (TypeScript/Backend)
        env:
          MIGRATEFLOW_BASE_URL: "http://localhost:8081"
        run: |
          python3 scripts/verify-contracts-live.py

      - name: Test idempotent re-run (Run 2 - with existing state file)
        env:
          MIGRATEFLOW_BASE_URL: "http://localhost:8081"
          MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN: "ci-secret-showcase-token"
          MIGRATEFLOW_ENGINEER_PASSWORD: "engineer-ci-pw"
          MIGRATEFLOW_REVIEWER_PASSWORD: "reviewer-ci-pw"
          MIGRATEFLOW_AUDITOR_PASSWORD: "auditor-ci-pw"
          MIGRATEFLOW_ADMIN_PASSWORD: "admin-ci-pw"
          MIGRATEFLOW_SHOWCASE_STATE_FILE: "/tmp/showcase-state.json"
        run: |
          python3 scripts/bootstrap-showcase.py

      - name: Test authoritative DB recovery (Run 3 - state file deleted)
        env:
          MIGRATEFLOW_BASE_URL: "http://localhost:8081"
          MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN: "ci-secret-showcase-token"
          MIGRATEFLOW_ENGINEER_PASSWORD: "engineer-ci-pw"
          MIGRATEFLOW_REVIEWER_PASSWORD: "reviewer-ci-pw"
          MIGRATEFLOW_AUDITOR_PASSWORD: "auditor-ci-pw"
          MIGRATEFLOW_ADMIN_PASSWORD: "admin-ci-pw"
          MIGRATEFLOW_SHOWCASE_STATE_FILE: "/tmp/showcase-state-deleted.json"
        run: |
          rm -f /tmp/showcase-state.json
          python3 scripts/bootstrap-showcase.py
          python3 scripts/verify-showcase.py
