spring:
  application:
    name: migrateflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/migrateflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: control
    default-schema: control
    create-schemas: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: control.BATCH_
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 26MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

migrateflow:
  upload-dir: ${MIGRATEFLOW_UPLOAD_DIR:./data/uploads}
  max-upload-bytes: ${MIGRATEFLOW_MAX_UPLOAD_BYTES:10485760}
  max-rows: ${MIGRATEFLOW_MAX_ROWS:10000}
  max-columns: 50
  batch-chunk-size: ${MIGRATEFLOW_BATCH_CHUNK_SIZE:100}
  demo-seed-enabled: ${MIGRATEFLOW_DEMO_SEED_ENABLED:false}
  # Test-only fault injection: fail a batch writer after N committed chunks.
  # Never set in a real deployment (spec section 13.2).
  test-fail-after-chunks: ${MIGRATEFLOW_TEST_FAIL_AFTER_CHUNKS:0}

logging:
  structured:
    format:
      console: logstash
