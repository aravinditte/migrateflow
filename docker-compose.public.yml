# Public deployment override (MF-005, MF-006)
# Applies public nginx configuration that restricts /api to GET /api/v1/showcase/**,
# turns off demo seeding, and disables showcase bootstrap endpoint.

services:
  backend:
    environment:
      MIGRATEFLOW_DEMO_SEED_ENABLED: "false"
      MIGRATEFLOW_SHOWCASE_BOOTSTRAP_ENABLED: "false"
    ports: [] # Do not expose backend port directly to host network

  frontend:
    volumes:
      - ./infra/nginx/nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
