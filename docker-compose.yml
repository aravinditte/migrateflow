services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-migrateflow}
      POSTGRES_USER: ${POSTGRES_USER:-migrateflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migrateflow-dev-pw}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-migrateflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-migrateflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-migrateflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-migrateflow-dev-pw}
      MIGRATEFLOW_DEMO_SEED_ENABLED: ${MIGRATEFLOW_DEMO_SEED_ENABLED:-true}
      # Public showcase bootstrap gate (Automated Showcase spec 4.2):
      # stays disabled unless the operator opts in AND sets a token.
      MIGRATEFLOW_SHOWCASE_BOOTSTRAP_ENABLED: ${MIGRATEFLOW_SHOWCASE_BOOTSTRAP_ENABLED:-false}
      MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN: ${MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN:-}
      MIGRATEFLOW_SHOWCASE_SLUG: ${MIGRATEFLOW_SHOWCASE_SLUG:-hinata-trading}
      MIGRATEFLOW_ENGINEER_PASSWORD: ${MIGRATEFLOW_ENGINEER_PASSWORD:-engineer-dev-pw}
      MIGRATEFLOW_REVIEWER_PASSWORD: ${MIGRATEFLOW_REVIEWER_PASSWORD:-reviewer-dev-pw}
      MIGRATEFLOW_AUDITOR_PASSWORD: ${MIGRATEFLOW_AUDITOR_PASSWORD:-auditor-dev-pw}
      MIGRATEFLOW_ADMIN_PASSWORD: ${MIGRATEFLOW_ADMIN_PASSWORD:-admin-dev-pw}
    volumes:
      - uploads:/var/migrateflow/uploads
    depends_on:
      db:
        condition: service_healthy
    # Bound to localhost on purpose (review S-08): for public hosting put
    # a TLS reverse proxy in front of the frontend and keep the backend
    # port private; never expose the operator workbench's known demo
    # credentials to the internet.
    ports:
      - "127.0.0.1:8081:8081"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

  # One-time public showcase bootstrap (opt-in profile, spec section 4).
  # Drives the REAL workflow over HTTP with the seeded demo actors and
  # registers the verified scenario. Idempotent; never resets anything.
  # Run once per fresh database:
  #   MIGRATEFLOW_SHOWCASE_BOOTSTRAP_ENABLED=true \
  #   MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN=<secret> \
  #   docker compose --profile showcase up showcase-bootstrap
  showcase-bootstrap:
    image: python:3.12-slim
    profiles: ["showcase"]
    depends_on:
      - backend
    environment:
      MIGRATEFLOW_BASE_URL: http://backend:8081
      MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN: ${MIGRATEFLOW_SHOWCASE_BOOTSTRAP_TOKEN:-}
      MIGRATEFLOW_FIXTURES_DIR: /app/fixtures
      # Writable progress cache on a named volume: ./scripts is mounted
      # read-only, so the state file must live elsewhere (review S-06).
      # The DB registry remains the canonical progress record.
      MIGRATEFLOW_SHOWCASE_STATE_FILE: /app/state/.showcase-bootstrap-state.json
      # Actor credentials follow the same variables the backend seed
      # reads, so a changed demo password reaches both sides (S-03).
      MIGRATEFLOW_ADMIN_PASSWORD: ${MIGRATEFLOW_ADMIN_PASSWORD:-admin-dev-pw}
      MIGRATEFLOW_ENGINEER_PASSWORD: ${MIGRATEFLOW_ENGINEER_PASSWORD:-engineer-dev-pw}
      MIGRATEFLOW_REVIEWER_PASSWORD: ${MIGRATEFLOW_REVIEWER_PASSWORD:-reviewer-dev-pw}
      MIGRATEFLOW_AUDITOR_PASSWORD: ${MIGRATEFLOW_AUDITOR_PASSWORD:-auditor-dev-pw}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./fixtures:/app/fixtures:ro
      - showcase-state:/app/state
    working_dir: /app
    command: ["python3", "scripts/bootstrap-showcase.py"]

volumes:
  pgdata:
  uploads:
  showcase-state:
