# Public showcase reverse proxy (MF-005):
# Exposes only anonymous GET requests to /api/v1/showcase/ and static assets.
# All operator endpoints (/api/v1/projects, /api/v1/auth, /api/v1/internal, etc.)
# and mutations are denied at the gateway.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Permitted anonymous showcase read API (GET and HEAD only)
    location /api/v1/showcase/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 "Method Not Allowed: Public showcase API is GET-only\n";
        }
        proxy_pass http://backend:8081/api/v1/showcase/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny all authenticated operator APIs, auth routes, internal bootstrap routes
    location /api/ {
        return 403 "Forbidden: Operator APIs are not accessible on the public showcase interface\n";
    }

    # Deny management actuator endpoints on the public interface
    location /actuator/ {
        return 403 "Forbidden\n";
    }

    # Frontend single-page application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
