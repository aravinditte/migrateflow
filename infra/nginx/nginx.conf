server {
    listen 80;
    server_name _;

    # Bundles allow 10 MiB per file (spec 3.3); nginx's 1 MB default would
    # reject legitimate uploads with 413 before they reach Spring Boot.
    client_max_body_size 30M;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser never talks to the backend directly,
    # so sessions and CSRF cookies stay on one origin.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
